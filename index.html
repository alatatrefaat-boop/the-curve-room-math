<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f0e7">
  <title>THE CURVE ROOM | Think. Analyze. Discover.</title>

  <style>
    :root {
      --cream: #f5f0e7;
      --paper: #fffdf8;
      --brown: #493727;
      --brown-light: #765b43;
      --gold: #b08b5a;
      --gold-light: #e8d9c2;
      --ink: #29241f;
      --muted: #82776b;
      --line: #e5dbcd;
      --green: #54765d;
      --red: #a34d43;
      --shadow: 0 12px 35px rgba(65, 47, 30, .08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--cream);
      color: var(--ink);
      line-height: 1.6;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    a {
      color: var(--brown-light);
    }

    .topbar {
      background: var(--brown);
      color: var(--cream);
      padding: 15px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(0,0,0,.12);
    }

    .brand {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 3px;
      white-space: nowrap;
    }

    .brand span {
      color: #d9bb91;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      justify-content: flex-end;
    }

    nav a {
      color: #f5eee4;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: .85;
    }

    nav a:hover {
      color: #e3c18f;
      opacity: 1;
    }

    .hero {
      min-height: 470px;
      padding: 100px 7% 90px;
      display: flex;
      align-items: center;
      background:
        linear-gradient(110deg, rgba(38,29,22,.94), rgba(66,48,34,.82)),
        radial-gradient(circle at 80% 20%, #b08b5a, transparent 40%);
      color: white;
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: "∿";
      position: absolute;
      right: 7%;
      top: 0;
      font-family: Georgia, serif;
      font-size: 330px;
      line-height: 1;
      color: rgba(255,255,255,.07);
      transform: rotate(-15deg);
    }

    .hero-content {
      max-width: 760px;
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      color: #d7b98d;
      text-transform: uppercase;
      letter-spacing: 4px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .hero h1 {
      font-family: Georgia, serif;
      font-size: clamp(48px, 8vw, 82px);
      line-height: 1.04;
      letter-spacing: 2px;
      margin-bottom: 22px;
    }

    .hero h1 span {
      color: #d8b98d;
    }

    .hero p {
      color: #e8dfd3;
      font-size: 17px;
      max-width: 580px;
      margin-bottom: 30px;
    }

    .main-button {
      display: inline-block;
      padding: 13px 24px;
      border: 1px solid #d6b98f;
      background: #d6b98f;
      color: #302419;
      border-radius: 4px;
      font-weight: bold;
      text-decoration: none;
      transition: .2s;
    }

    .main-button:hover {
      background: transparent;
      color: white;
    }

    .section {
      padding: 75px 7%;
      scroll-margin-top: 75px;
    }

    .section-heading {
      margin-bottom: 35px;
      max-width: 760px;
    }

    .section-heading .eyebrow {
      color: var(--gold);
      margin-bottom: 8px;
    }

    .section-heading h2 {
      font-family: Georgia, serif;
      color: var(--brown);
      font-size: clamp(32px, 5vw, 48px);
      margin-bottom: 10px;
    }

    .section-heading p {
      color: var(--muted);
    }

    .intro-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-top: 35px;
    }

    .intro-card {
      background: var(--paper);
      padding: 25px;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .intro-card .number {
      color: var(--gold);
      font-family: Georgia, serif;
      font-size: 36px;
      margin-bottom: 8px;
    }

    .intro-card h3 {
      color: var(--brown);
      margin-bottom: 7px;
    }

    .intro-card p {
      color: var(--muted);
      font-size: 14px;
    }

    .observe-section {
      background: #eee6d9;
    }

    .graph-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
    }

    .graph-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .graph-card-header {
      padding: 20px 22px 10px;
    }

    .graph-card-header .category {
      color: var(--gold);
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .graph-card h3 {
      color: var(--brown);
      font-family: Georgia, serif;
      font-size: 26px;
      margin-top: 3px;
    }

    .graph-image-wrap {
      background: white;
      margin: 12px 20px;
      border: 1px solid #e8e3dc;
      border-radius: 7px;
      min-height: 230px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    .original-graph {
      display: block;
      width: 100%;
      max-height: 420px;
      object-fit: contain;
    }

    .graph-details {
      padding: 5px 22px 22px;
    }

    .graph-details p {
      font-size: 14px;
      color: var(--muted);
      margin: 7px 0;
    }

    .source-note {
      margin-top: 17px;
      padding: 13px 15px;
      background: #f2eadf;
      border-left: 4px solid var(--gold);
      border-radius: 4px;
      font-size: 13px;
      color: var(--brown);
    }

    .source-note strong {
      display: block;
      margin-bottom: 3px;
    }

    /* MEASURE SECTION */
    .measure-section {
      background: var(--paper);
    }

    .experiment-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
    }

    .experiment-card {
      background: #faf6ef;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 24px;
    }

    .experiment-card h3 {
      color: var(--brown);
      font-family: Georgia, serif;
      font-size: 23px;
      margin-bottom: 10px;
    }

    .experiment-card p {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 12px;
    }

    .edit-hint {
      font-size: 12px;
      color: var(--brown-light);
      background: #f2eadf;
      padding: 6px 10px;
      border-radius: 5px;
      display: inline-block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0 15px;
      font-size: 13px;
      background: white;
    }

    .data-table th,
    .data-table td {
      border: 1px solid var(--line);
      padding: 7px;
      text-align: center;
    }

    .data-table th {
      background: var(--brown);
      color: white;
    }

    .data-table tr:nth-child(even) {
      background: #f8f3eb;
    }

    .table-input {
      width: 100%;
      max-width: 85px;
      padding: 5px 6px;
      text-align: center;
      border: 1px solid #d5c8b6;
      border-radius: 4px;
      background: #fffdf9;
      color: var(--ink);
      font-weight: bold;
      font-size: 13px;
    }

    .table-input:focus {
      outline: none;
      border-color: var(--gold);
      background: #fff8eb;
    }

    .mini-chart {
      width: 100%;
      height: 230px;
      display: block;
      background: white;
      border: 1px solid var(--line);
      border-radius: 6px;
      margin: 12px 0 0;
    }

    /* DISCOVER SECTION */
    .discover-section {
      background: #eee6d9;
    }

    .discover-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .discover-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 25px;
      box-shadow: var(--shadow);
    }

    .discover-card h3 {
      color: var(--brown);
      font-family: Georgia, serif;
      font-size: 23px;
      margin-bottom: 10px;
    }

    .discover-card p {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 12px;
    }

    .intersection-badge {
      display: inline-block;
      background: #f2eadf;
      border-left: 4px solid var(--gold);
      padding: 8px 12px;
      font-size: 13px;
      color: var(--brown);
      font-weight: bold;
      border-radius: 4px;
      margin-top: 10px;
    }

    /* CHALLENGE SECTION */
    .challenge-section {
      background: var(--paper);
    }

    .quiz-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
      margin-bottom: 45px;
    }

    .quiz-card {
      background: #faf6ef;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .quiz-card .q-num {
      color: var(--gold);
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .quiz-card h3 {
      color: var(--brown);
      font-family: Georgia, serif;
      font-size: 19px;
      margin-bottom: 14px;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-bottom: 14px;
    }

    .option-btn {
      text-align: left;
      padding: 10px 13px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      font-size: 14px;
      transition: .15s;
    }

    .option-btn:hover {
      border-color: var(--gold);
background: #fffaf0;
}
.option-btn.selected {
border-color: var(--brown);
background: #efe5d5;
font-weight: bold;
}
.option-btn.correct {
border-color: var(--green);
background: #e6f2ea;
color: #24422c;
font-weight: bold;
}
.option-btn.wrong {
border-color: var(--red);
background: #fae8e6;
color: #6b241d;
}
.check-btn {
padding: 10px 16px;
background: var(--brown);
color: white;
border: none;
border-radius: 5px;
font-size: 13px;
font-weight: bold;
align-self: flex-start;
}
.check-btn:hover {
background: var(--brown-light);
}
.justification-box {
display: none;
margin-top: 14px;
padding: 14px;
background: white;
border-left: 4px solid var(--green);
border-radius: 5px;
font-size: 13.5px;
color: var(--ink);
}
.justification-box.show {
display: block;
}
/* CLASS VOTING DESK */
.voting-desk {
background: #f5eee3;
border: 2px solid var(--gold);
border-radius: 12px;
padding: 32px;
box-shadow: var(--shadow);
}
.voting-desk .eyebrow {
color: var(--gold);
margin-bottom: 6px;
}
.voting-desk h3 {
font-family: Georgia, serif;
color: var(--brown);
font-size: 28px;
margin-bottom: 14px;
}
.voting-scenario {
background: var(--paper);
border: 1px solid var(--line);
border-radius: 8px;
padding: 20px;
margin-bottom: 18px;
font-size: 15px;
}
.voting-scenario ul {
margin: 10px 0 12px 22px;
}
.voting-scenario li {
margin-bottom: 4px;
}
.voting-quote {
background: #f2eadf;
border-left: 4px solid var(--brown);
padding: 10px 14px;
margin: 12px 0;
font-style: italic;
color: var(--brown);
}
.voting-question {
font-weight: bold;
color: var(--brown);
font-size: 16px;
margin-top: 10px;
}
.voting-options {
display: flex;
flex-direction: column;
gap: 10px;
margin: 16px 0;
}
.vote-choice {
display: flex;
align-items: flex-start;
gap: 10px;
background: white;
border: 1px solid var(--line);
border-radius: 7px;
padding: 13px 15px;
cursor: pointer;
transition: .15s;
}
.vote-choice:hover {
border-color: var(--gold);
background: #fffdf8;
}
.vote-choice input[type="radio"] {
margin-top: 4px;
accent-color: var(--brown);
}
.vote-choice.correct-choice {
border-color: var(--green);
background: #e6f2ea;
}
.vote-choice.wrong-choice {
border-color: var(--red);
background: #fae8e6;
}
.submit-vote-btn {
padding: 13px 26px;
background: var(--brown);
color: white;
border: none;
border-radius: 6px;
font-weight: bold;
font-size: 14px;
}
.submit-vote-btn:hover {
background: var(--brown-light);
}
.vote-result {
display: none;
margin-top: 20px;
padding: 20px;
background: white;
border: 1px solid var(--line);
border-left: 5px solid var(--green);
border-radius: 8px;
font-size: 14.5px;
}
.vote-result.show {
display: block;
}
.vote-result h4 {
color: var(--green);
font-size: 17px;
margin-bottom: 10px;
}
.vote-result ul {
margin: 8px 0 12px 22px;
}
.vote-result li {
margin-bottom: 5px;
}
.key-discovery {
margin-top: 12px;
padding: 12px 15px;
background: #f2eadf;
border-radius: 6px;
color: var(--brown);
font-weight: bold;
}
footer {
background: var(--brown);
color: #e8dfd3;
text-align: center;
padding: 28px 6%;
font-size: 13px;
}
@media (max-width: 850px) {
.intro-grid,
.graph-grid,
.experiment-grid,
.discover-grid,
.quiz-grid {
grid-template-columns: 1fr;
}
}
